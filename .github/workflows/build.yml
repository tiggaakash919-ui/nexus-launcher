          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.nexus.launcher.NexusViewModel
          @Composable fun SettingsScreen(viewModel: NexusViewModel, onBack: () -> Unit) {
              val context = LocalContext.current; val settings by viewModel.settings.collectAsState()
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Back") }; Text("Settings", style = MaterialTheme.typography.headlineMedium, modifier = Modifier.padding(start = 8.dp, top = 10.dp)) }
                  Spacer(Modifier.height(12.dp))
                  Card(Modifier.fillMaxWidth()) { Column(Modifier.padding(16.dp)) {
                      Row { Text("Dark theme", modifier = Modifier.weight(1f)); Switch(settings.darkTheme, { viewModel.setDarkTheme(it) }) }
                      Row { Text("Show clock", modifier = Modifier.weight(1f)); Switch(settings.showClock, { viewModel.setShowClock(it) }) }
                  } }
                  Spacer(Modifier.height(12.dp))
                  Button(onClick = {
                      val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val rm = context.getSystemService(android.app.role.RoleManager::class.java)
                          if (rm != null && rm.isRoleAvailable(android.app.role.RoleManager.ROLE_HOME) && !rm.isRoleHeld(android.app.role.RoleManager.ROLE_HOME)) rm.createRequestRoleIntent(android.app.role.RoleManager.ROLE_HOME) else Intent(Settings.ACTION_HOME_SETTINGS)
                      } else Intent(Settings.ACTION_HOME_SETTINGS)
                      context.startActivity(intent)
                  }, modifier = Modifier.fillMaxWidth()) { Text("Set as Home App") }
              }
          }
