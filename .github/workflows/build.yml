          cat << 'EOF' > app/src/main/java/com/nexus/launcher/ui/NexusApp.kt
          package com.nexus.launcher.ui
          import androidx.compose.runtime.Composable
          import androidx.navigation.compose.*
          import com.nexus.launcher.NexusViewModel
          import com.nexus.launcher.ui.screens.*
          @Composable fun NexusApp(viewModel: NexusViewModel) {
              val nav = rememberNavController()
              NavHost(navController = nav, startDestination = Routes.HOME) {
                  composable(Routes.HOME) { HomeScreen(viewModel, { nav.navigate(Routes.DRAWER) }, { nav.navigate(Routes.GAMING) }, { nav.navigate(Routes.DASHBOARD) }, { nav.navigate(Routes.SETTINGS) }) }
                  composable(Routes.DRAWER) { AppDrawerScreen(viewModel, { nav.popBackStack() }) }
                  composable(Routes.DASHBOARD) { DashboardScreen(viewModel, { nav.popBackStack() }) }
                  composable(Routes.GAMING) { GamingHubScreen(viewModel, { nav.popBackStack() }) }
                  composable(Routes.SETTINGS) { SettingsScreen(viewModel, { nav.popBackStack() }) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/ui/components/AppIcon.kt
          package com.nexus.launcher.ui.components
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          private fun Drawable.toImageBitmap(sizePx: Int = 144): ImageBitmap {
              val bmp = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888); setBounds(0, 0, sizePx, sizePx); draw(Canvas(bmp)); return bmp.asImageBitmap()
          }
          @Composable fun AppIcon(label: String, drawable: Drawable, modifier: Modifier = Modifier, showLabel: Boolean = true) {
              val bmp = remember(drawable) { drawable.toImageBitmap() }
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = modifier.padding(4.dp)) {
                  Image(bitmap = bmp, contentDescription = label, contentScale = ContentScale.Fit, modifier = Modifier.size(56.dp).clip(RoundedCornerShape(16.dp)))
                  if (showLabel) Text(label, maxLines = 1, overflow = TextOverflow.Ellipsis, style = MaterialTheme.typography.labelSmall, modifier = Modifier.padding(top = 4.dp))
              }
          }
