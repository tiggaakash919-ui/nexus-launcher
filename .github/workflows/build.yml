          import androidx.compose.runtime.*
          import kotlinx.coroutines.delay
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          @Composable fun rememberCurrentTime(): String {
              var now by remember { mutableStateOf(LocalDateTime.now()) }; LaunchedEffect(Unit) { while (true) { now = LocalDateTime.now(); delay(1000L) } }
              return now.format(DateTimeFormatter.ofPattern("HH:mm"))
          }
          @Composable fun rememberCurrentDate(): String {
              var now by remember { mutableStateOf(LocalDateTime.now()) }; LaunchedEffect(Unit) { while (true) { now = LocalDateTime.now(); delay(60000L) } }
