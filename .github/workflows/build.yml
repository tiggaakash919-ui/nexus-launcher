          package com.nexus.launcher.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.nexus.launcher.NexusViewModel
          import com.nexus.launcher.profile.ProfileManager
          import kotlinx.coroutines.delay
          @Composable fun DashboardScreen(viewModel: NexusViewModel, onBack: () -> Unit) {
              val snapshot by viewModel.snapshot.collectAsState(); val recs by viewModel.recommendations.collectAsState(); val settings by viewModel.settings.collectAsState()
              val interval = ProfileManager.configFor(settings.profile).monitoringIntervalMs
              LaunchedEffect(Unit) { while (true) { viewModel.sampleMetrics(); delay(interval) } }
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Back") }; Text("Performance", style = MaterialTheme.typography.headlineMedium, modifier = Modifier.padding(start = 8.dp, top = 10.dp)) }
                  Spacer(Modifier.height(12.dp))
                  val mem = snapshot?.memory
                  Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) { Column(Modifier.padding(16.dp)) {
                      Text("Memory", style = MaterialTheme.typography.titleMedium)
                      if (mem == null) Text("Unavailable") else Text("${(mem.usedRatio * 100).toInt()}% used (${mem.usedBytes / 1_000_000} / ${mem.totalBytes / 1_000_000} MB)")
                  } }
                  val batt = snapshot?.battery
                  Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) { Column(Modifier.padding(16.dp)) {
                      Text("Battery", style = MaterialTheme.typography.titleMedium)
                      Text("Level: ${batt?.levelPercent?.let { "$it%" } ?: "Unavailable"}")
                      Text("Temp: ${batt?.temperatureC?.let { "%.1f °C".format(it) } ?: "Unavailable"}")
                  } }
                  val thermal = snapshot?.thermal
                  Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) { Column(Modifier.padding(16.dp)) {
                      Text("Thermal", style = MaterialTheme.typography.titleMedium); Text(thermal?.label() ?: "Unavailable")
                  } }
                  Spacer(Modifier.height(12.dp))
                  Text("Recommendations", style = MaterialTheme.typography.titleLarge)
                  if (recs.isEmpty()) Text("No recommendations.") else recs.forEach { r ->
                      Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) { Column(Modifier.padding(12.dp)) { Text(r.title, style = MaterialTheme.typography.titleSmall); Text(r.body, style = MaterialTheme.typography.bodySmall) } }
                  }
              }
          }
