name: Build NEXUS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Remove old zip
        run: rm -f *.zip

      - name: Generate Complete Project
        run: |
          mkdir -p app/src/main/java/com/nexus/launcher/data
          mkdir -p app/src/main/java/com/nexus/launcher/metrics
          mkdir -p app/src/main/java/com/nexus/launcher/profile
          mkdir -p app/src/main/java/com/nexus/launcher/recommend
          mkdir -p app/src/main/java/com/nexus/launcher/ui/theme
          mkdir -p app/src/main/java/com/nexus/launcher/ui/components
          mkdir -p app/src/main/java/com/nexus/launcher/ui/screens
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/test/java/com/nexus/launcher

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "NexusLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.nexus.launcher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexus.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              testOptions { unitTests.isReturnDefaultValues = true }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.1")
              implementation("androidx.datastore:datastore-preferences:1.1.4")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <queries>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.GAME" /></intent>
              </queries>
              <application android:name=".NexusApplication" android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:label="NEXUS" android:theme="@style/Theme.Nexus">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:stateNotNeeded="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">NEXUS</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.Nexus" parent="android:Theme.Material.NoActionBar"><item name="android:windowBackground">#0A0A0F</item></style></resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#22D3EE" android:pathData="M30,78 L30,30 L44,30 L44,60 L64,30 L78,30 L78,78 L64,78 L64,48 L44,78 Z" /></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0A0A0F" android:pathData="M0,0 h108 v108 h-108 Z" /></vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/NexusApplication.kt
          package com.nexus.launcher
          import android.app.Application
          class NexusApplication : Application()
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/MainActivity.kt
          package com.nexus.launcher
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import com.nexus.launcher.ui.NexusApp
          import com.nexus.launcher.ui.theme.NexusTheme
          class MainActivity : ComponentActivity() {
              private val viewModel: NexusViewModel by viewModels()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val settings by viewModel.settings.collectAsState()
                      NexusTheme(darkTheme = settings.darkTheme) { NexusApp(viewModel = viewModel) }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/NexusViewModel.kt
          package com.nexus.launcher
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.nexus.launcher.data.*
          import com.nexus.launcher.metrics.*
          import com.nexus.launcher.profile.*
          import com.nexus.launcher.recommend.*
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          class NexusViewModel(app: Application) : AndroidViewModel(app) {
              private val appsRepo = AppRepository(app)
              private val gamesRepo = GameRepository(app)
              private val settingsRepo = SettingsRepository(app)
              private val monitor = PerformanceMonitor(app)
              private val recommender = RecommendationEngine()
              val settings: StateFlow<NexusSettings> = settingsRepo.settings.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), NexusSettings())
              private val _apps = MutableStateFlow<List<AppInfo>>(emptyList()); val apps = _apps.asStateFlow()
              private val _games = MutableStateFlow<List<AppInfo>>(emptyList()); val games = _games.asStateFlow()
              private val _snapshot = MutableStateFlow<PerformanceSnapshot?>(null); val snapshot = _snapshot.asStateFlow()
              private val _recs = MutableStateFlow<List<Recommendation>>(emptyList()); val recommendations = _recs.asStateFlow()
              init { refreshApps(); collectBattery() }
              fun refreshApps() = viewModelScope.launch { _apps.value = appsRepo.loadLaunchable(); _games.value = gamesRepo.discoverGames() }
              private fun collectBattery() = viewModelScope.launch { monitor.batteryFlow().collect { publishSnapshot(it) } }
              fun sampleMetrics() { publishSnapshot(currentBattery ?: BatteryReading(null, null, null)) }
              private var currentBattery: BatteryReading? = null
              private fun publishSnapshot(battery: BatteryReading) {
                  currentBattery = battery
                  val mem = monitor.memory()
                  _snapshot.value = PerformanceSnapshot(mem, battery, monitor.thermal(), monitor.uptimeMillis(), monitor.capabilities())
                  _recs.value = recommender.evaluate(mem, battery)
              }
              fun launchApp(pkg: String) = appsRepo.launch(pkg)
              fun setProfile(p: GamingProfile) = viewModelScope.launch { settingsRepo.setProfile(p) }
              fun setDarkTheme(v: Boolean) = viewModelScope.launch { settingsRepo.setDarkTheme(v) }
              fun setShowClock(v: Boolean) = viewModelScope.launch { settingsRepo.setShowClock(v) }
              fun toggleFavoriteApp(pkg: String) = viewModelScope.launch { settingsRepo.toggleFavoriteApp(pkg) }
              fun toggleFavoriteGame(pkg: String) = viewModelScope.launch { settingsRepo.toggleFavoriteGame(pkg) }
              fun profileExplanation(p: GamingProfile) = ProfileManager.explain(p)
          }
          EOF

          # --- DATA LAYER ---
          cat << 'EOF' > app/src/main/java/com/nexus/launcher/data/AppInfo.kt
          package com.nexus.launcher.data
          import android.graphics.drawable.Drawable
          data class AppInfo(val packageName: String, val label: String, val icon: Drawable, val isGame: Boolean = false)
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/data/AppRepository.kt
          package com.nexus.launcher.data
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          sealed interface LaunchResult { object Success : LaunchResult; object NoIntent : LaunchResult; data class Error(val message: String) : LaunchResult }
          class AppRepository(private val context: Context) {
              suspend fun loadLaunchable(): List<AppInfo> = withContext(Dispatchers.IO) {
                  val pm = context.packageManager
                  pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), PackageManager.MATCH_ALL).mapNotNull { ri ->
                      val pkg = ri.activityInfo?.packageName ?: return@mapNotNull null
                      if (pkg == context.packageName) return@mapNotNull null
                      AppInfo(pkg, ri.loadLabel(pm).toString(), ri.loadIcon(pm))
                  }.distinctBy { it.packageName }.sortedBy { it.label.lowercase() }
              }
              fun launch(packageName: String): LaunchResult {
                  val intent = context.packageManager.getLaunchIntentForPackage(packageName) ?: return LaunchResult.NoIntent
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try { context.startActivity(intent); LaunchResult.Success } catch (e: Exception) { LaunchResult.Error(e.message ?: "Error") }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/data/GameRepository.kt
          package com.nexus.launcher.data
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          class GameRepository(private val context: Context) {
              suspend fun discoverGames(): List<AppInfo> = withContext(Dispatchers.IO) {
                  val pm = context.packageManager
                  val byCategory = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_GAME), PackageManager.MATCH_ALL).mapNotNull { it.activityInfo?.packageName }.toSet()
                  val byMeta = mutableSetOf<String>()
                  for (app in pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                      if (app.metaData?.getString("android.app.category") == "game") byMeta += app.packageName
                  }
                  (byCategory + byMeta).mapNotNull { pkg ->
                      val ai = runCatching { pm.getApplicationInfo(pkg, 0) }.getOrNull() ?: return@mapNotNull null
                      if (pm.getLaunchIntentForPackage(pkg) == null) return@mapNotNull null
                      AppInfo(pkg, ai.loadLabel(pm).toString(), ai.loadIcon(pm), true)
                  }.distinctBy { it.packageName }.sortedBy { it.label.lowercase() }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/data/SettingsRepository.kt
          package com.nexus.launcher.data
          import android.content.Context
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import com.nexus.launcher.profile.GamingProfile
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          private val Context.dataStore by preferencesDataStore("nexus_settings")
          data class NexusSettings(val darkTheme: Boolean = true, val profile: GamingProfile = GamingProfile.BALANCED, val gridColumns: Int = 4, val showClock: Boolean = true, val favoriteApps: Set<String> = emptySet(), val favoriteGames: Set<String> = emptySet())
          class SettingsRepository(private val context: Context) {
              private object K { val DARK = booleanPreferencesKey("dark"); val PROF = stringPreferencesKey("prof"); val COLS = intPreferencesKey("cols"); val CLOCK = booleanPreferencesKey("clock"); val FAV = stringSetPreferencesKey("fav"); val FG = stringSetPreferencesKey("fg") }
              val settings: Flow<NexusSettings> = context.dataStore.data.map { p ->
                  NexusSettings(p[K.DARK] ?: true, runCatching { GamingProfile.valueOf(p[K.PROF] ?: "") }.getOrDefault(GamingProfile.BALANCED), (p[K.COLS] ?: 4).coerceIn(3, 6), p[K.CLOCK] ?: true, p[K.FAV] ?: emptySet(), p[K.FG] ?: emptySet())
              }
              suspend fun setDarkTheme(v: Boolean) = context.dataStore.edit { it[K.DARK] = v }
              suspend fun setProfile(v: GamingProfile) = context.dataStore.edit { it[K.PROF] = v.name }
              suspend fun setShowClock(v: Boolean) = context.dataStore.edit { it[K.CLOCK] = v }
              suspend fun toggleFavoriteApp(pkg: String) = context.dataStore.edit { val c = it[K.FAV] ?: emptySet(); it[K.FAV] = if (pkg in c) c - pkg else c + pkg }
              suspend fun toggleFavoriteGame(pkg: String) = context.dataStore.edit { val c = it[K.FG] ?: emptySet(); it[K.FG] = if (pkg in c) c - pkg else c + pkg }
          }
          EOF

          # --- METRICS, PROFILE & RECOMMENDATIONS ---
          cat << 'EOF' > app/src/main/java/com/nexus/launcher/metrics/Capability.kt
          package com.nexus.launcher.metrics
          enum class Capability { MEMORY, BATTERY_LEVEL, BATTERY_TEMPERATURE, THERMAL_STATUS, UPTIME }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/metrics/PerformanceSnapshot.kt
          package com.nexus.launcher.metrics
          data class MemoryReading(val totalBytes: Long, val availableBytes: Long, val lowMemory: Boolean) {
              val usedBytes: Long get() = totalBytes - availableBytes
              val usedRatio: Float get() = if (totalBytes <= 0L) 0f else usedBytes.toFloat() / totalBytes
          }
          data class BatteryReading(val levelPercent: Int?, val temperatureC: Float?, val charging: Boolean?)
          data class ThermalReading(val status: Int?) {
              fun label(): String = when (status) { null -> "Unavailable"; 0 -> "None"; 1 -> "Light"; 2 -> "Moderate"; 3 -> "Severe"; else -> "Unknown" }
          }
          data class PerformanceSnapshot(val memory: MemoryReading?, val battery: BatteryReading?, val thermal: ThermalReading?, val uptimeMillis: Long?, val capabilities: Set<Capability>)
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/metrics/PerformanceMonitor.kt
          package com.nexus.launcher.metrics
          import android.app.ActivityManager
          import android.content.*
          import android.os.*
          import kotlinx.coroutines.channels.awaitClose
          import kotlinx.coroutines.flow.*
          class PerformanceMonitor(private val context: Context) {
              fun memory(): MemoryReading? {
                  val am = context.getSystemService(ActivityManager::class.java) ?: return null
                  val info = ActivityManager.MemoryInfo(); am.getMemoryInfo(info)
                  return if (info.totalMem <= 0L) null else MemoryReading(info.totalMem, info.availMem, info.lowMemory)
              }
              fun thermal(): ThermalReading? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return null
                  val pm = context.getSystemService(PowerManager::class.java) ?: return null
                  return ThermalReading(pm.currentThermalStatus)
              }
              fun uptimeMillis(): Long? = SystemClock.elapsedRealtime()
              fun batteryFlow(): Flow<BatteryReading> = callbackFlow {
                  val receiver = object : BroadcastReceiver() {
                      override fun onReceive(c: Context?, i: Intent?) {
                          if (i == null) return
                          val level = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                          val scale = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                          val tenths = i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Int.MIN_VALUE)
                          val status = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                          trySend(BatteryReading(if (level >= 0 && scale > 0) level * 100 / scale else null, if (tenths != Int.MIN_VALUE) tenths / 10f else null, when (status) { BatteryManager.BATTERY_STATUS_CHARGING, BatteryManager.BATTERY_STATUS_FULL -> true; BatteryManager.BATTERY_STATUS_DISCHARGING -> false; else -> null }))
                      }
                  }
                  context.registerReceiver(receiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  awaitClose { context.unregisterReceiver(receiver) }
              }
              fun capabilities(): Set<Capability> = buildSet {
                  if (context.getSystemService(ActivityManager::class.java) != null) add(Capability.MEMORY)
                  add(Capability.BATTERY_LEVEL); add(Capability.BATTERY_TEMPERATURE)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) add(Capability.THERMAL_STATUS)
                  add(Capability.UPTIME)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/profile/GamingProfile.kt
          package com.nexus.launcher.profile
          enum class GamingProfile(val label: String) { BALANCED("Balanced"), GAMING("Gaming"), BATTERY_SAVER("Battery Saver"), CUSTOM("Custom") }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/profile/ProfileManager.kt
          package com.nexus.launcher.profile
          data class ProfileConfig(val monitoringIntervalMs: Long, val animationsEnabled: Boolean, val showDashboardOnLaunch: Boolean)
          object ProfileManager {
              fun configFor(profile: GamingProfile): ProfileConfig = when (profile) {
                  GamingProfile.BALANCED -> ProfileConfig(5000L, true, false)
                  GamingProfile.GAMING -> ProfileConfig(3000L, false, true)
                  GamingProfile.BATTERY_SAVER -> ProfileConfig(15000L, false, false)
                  GamingProfile.CUSTOM -> ProfileConfig(5000L, true, false)
              }
              fun explain(profile: GamingProfile): String = when (profile) {
                  GamingProfile.BALANCED -> "Default monitoring every 5s. No system settings modified."
                  GamingProfile.GAMING -> "NEXUS polls every 3s and disables its own animations. Does NOT change CPU, GPU, or refresh-rate."
                  GamingProfile.BATTERY_SAVER -> "NEXUS polls every 15s. Battery and thermal protections remain untouched."
                  GamingProfile.CUSTOM -> "Custom interval and animation behavior."
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/recommend/Recommendation.kt
          package com.nexus.launcher.recommend
          enum class Severity { INFO, WARN }
          data class Recommendation(val title: String, val body: String, val severity: Severity)
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/recommend/RecommendationEngine.kt
          package com.nexus.launcher.recommend
          import com.nexus.launcher.metrics.BatteryReading
          import com.nexus.launcher.metrics.MemoryReading
          class RecommendationEngine {
              fun evaluate(memory: MemoryReading?, battery: BatteryReading?): List<Recommendation> {
                  val out = mutableListOf<Recommendation>()
                  if (memory != null && memory.usedRatio >= 0.85f) out += Recommendation("High memory pressure", "Memory >85%. Close unused apps.", Severity.WARN)
                  battery?.temperatureC?.let { if (it >= 42f) out += Recommendation("Device is warm", "Pause intensive use. Do not disable thermal protection.", Severity.WARN) }
                  battery?.levelPercent?.let { if (it <= 15 && battery.charging == false) out += Recommendation("Low battery", "Enable Battery Saver.", Severity.INFO) }
                  return out
              }
          }
          EOF

          # --- UI LAYER ---
          cat << 'EOF' > app/src/main/java/com/nexus/launcher/ui/theme/Theme.kt
          package com.nexus.launcher.ui.theme
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          private val Cyan = Color(0xFF22D3EE); private val Violet = Color(0xFFA78BFA); private val BgDark = Color(0xFF0A0A0F); private val SurfaceDark = Color(0xFF16161D)
          private val DarkScheme = darkColorScheme(primary = Cyan, secondary = Violet, background = BgDark, surface = SurfaceDark, onPrimary = Color.Black, onSecondary = Color.Black, onBackground = Color(0xFFE5E7EB), onSurface = Color(0xFFE5E7EB))
          private val LightScheme = lightColorScheme(primary = Cyan, secondary = Violet)
          @Composable fun NexusTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = if (darkTheme) DarkScheme else LightScheme, content = content)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/nexus/launcher/ui/Routes.kt
          package com.nexus.launcher.ui
          object Routes { const val HOME = "home"; const val DRAWER = "drawer"; const val DASHBOARD = "dashboard"; const val GAMING = "gaming"; const val SETTINGS = "settings" }
